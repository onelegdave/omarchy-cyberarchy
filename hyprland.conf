# Window borders
general {
    col.active_border = rgb(e43995) rgb(4ad9e0) 45deg
    col.inactive_border = rgb(1e1e2a)
}

# Dim inactive windows so the focused one carries the accent
decoration {
    dim_inactive = true
    dim_strength = 0.4
    dim_around = 0.4
    dim_special = 0.4
    dim_modal = true
}
